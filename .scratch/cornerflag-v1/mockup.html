<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CornerFlag Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=Saira:wght@400;500;600;700&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
:root {
  --font-body: Outfit;
  --font-score: Outfit;
  --score-size: 30px;
  --zoom: 1;
  --tint: 40%;
  --reach: 100%;
  --opacity: 0.7;
  --text-1: rgb(255 255 255 / 0.95);
  --text-2: rgb(255 255 255 / 0.62);
}
* { box-sizing: border-box; }
body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #1b1b1f; color: #e8e8ea; }

/* control panel */
.panel { display: flex; flex-wrap: wrap; gap: 14px 28px; padding: 14px 16px; background: #26262b; border-bottom: 1px solid #34343a; }
.group { display: flex; flex-direction: column; gap: 6px; }
.group > b { font-size: 11px; color: #9a9aa2; font-weight: 600; letter-spacing: .04em; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.panel button, .panel select { font: inherit; color: inherit; background: #34343a; border: 1px solid #44444b; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.panel button[aria-pressed="true"] { background: #3d6bff; border-color: #3d6bff; color: #fff; }
.panel input[type=range] { width: 140px; }
.val { font-variant-numeric: tabular-nums; min-width: 72px; color: #c8c8ce; }
#readout { font: 12px ui-monospace, Consolas, monospace; color: #c8c8ce; user-select: all; }

/* fake desktop */
.desk { min-height: calc(100vh - 120px); padding: 32px; display: flex; flex-wrap: wrap; gap: 30px 28px; align-content: flex-start; background-size: cover; background-position: center; }
.desk[data-wall="bloom"] { background-image: radial-gradient(ellipse at 28% 62%, #3d7bff 0, transparent 45%), radial-gradient(ellipse at 72% 38%, #1fb6ff 0, transparent 40%), linear-gradient(160deg, #0a1530, #0d2a5c); }
.desk[data-wall="light"] { background-image: radial-gradient(circle at 20% 30%, #fff 0, transparent 40%), radial-gradient(circle at 75% 70%, #f4e9d8 0, transparent 35%), linear-gradient(135deg, #dfe8f1, #b9c9da); }
.desk[data-wall="photo"] { background-image: url("https://picsum.photos/id/1018/1920/1200"), linear-gradient(120deg, #f6d365, #2c3e50); }
.slot { display: flex; flex-direction: column; gap: 6px; }
.slot > small { color: #fff; text-shadow: 0 1px 3px rgb(0 0 0 / .8); font-size: 12px; }

/* widget card: base design at 320px wide, scaled with zoom */
.card {
  zoom: var(--zoom);
  width: 320px; height: 146px; padding: 11px 14px 12px;
  display: flex; flex-direction: column;
  border-radius: 8px; border: 1px solid rgb(255 255 255 / 0.09);
  background-color: rgb(24 24 27 / var(--opacity));
  backdrop-filter: blur(28px) saturate(150%);
  font-family: var(--font-body); color: var(--text-1);
  user-select: none; cursor: default;
}
/* border-box origin: otherwise the padding-box-sized gradient repeats into the 1px border on the far edge */
.card.tinted { background-image: linear-gradient(var(--dir), color-mix(in srgb, var(--tc) var(--tint), transparent) 0%, transparent var(--reach)); background-origin: border-box; }
.head { display: flex; align-items: center; justify-content: space-between; height: 16px; margin-bottom: 5px; font-size: 11px; font-weight: 500; color: var(--text-2); letter-spacing: .01em; }
.refresh { opacity: 0; transition: opacity .15s; display: flex; color: var(--text-2); }
.card:hover .refresh { opacity: 1; }
.match { flex: 1; display: grid; grid-template-columns: 1fr 104px 1fr; align-items: center; }
.team { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
.team img { width: 40px; height: 40px; object-fit: contain; }
.name { max-width: 100%; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.center { display: flex; flex-direction: column; align-items: center; gap: 2px; font-variant-numeric: tabular-nums; }
.score { font-family: var(--font-score); font-size: var(--score-size); font-weight: 700; line-height: 1; letter-spacing: -.01em; }
/* home | dash | away: equal side cells pin the dash to the card's center; digits grow outward */
.center .score { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; column-gap: 8px; }
.center .score > :first-child { text-align: right; }
.center .score > :last-child { text-align: left; }
/* dot + clock centered as one unit */
.status { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-2); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #ff3b30; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.date { font-size: 12px; color: var(--text-2); }
.time { font-family: var(--font-score); font-size: calc(var(--score-size) * .75); font-weight: 700; line-height: 1.1; }
/* pill in --bc: lightened text on a faint fill, so dark team colors stay readable */
.badge { margin-top: 3px; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; color: color-mix(in srgb, var(--bc) 55%, white); background: color-mix(in srgb, var(--bc) 22%, transparent); }
.badge.neutral { color: var(--text-2); background: rgb(255 255 255 / 0.1); }
.foot { display: flex; align-items: center; gap: 8px; height: 23px; margin-top: 5px; padding-top: 6px; font-size: 11.5px; color: var(--text-2); }
.foot.live { border-top: 1px solid rgb(255 255 255 / 0.12); }
.goal { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.more { flex: none; margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; opacity: 0; transition: opacity .15s; }
.card:hover .more { opacity: 1; }
.empty { flex: 1; display: grid; place-items: center; font-size: 13px; color: var(--text-2); }
.glyphs { zoom: var(--zoom); width: 640px; padding: 12px 14px; border-radius: 8px; border: 1px solid rgb(255 255 255 / 0.09); background: rgb(24 24 27 / var(--opacity)); backdrop-filter: blur(28px) saturate(150%); font-family: var(--font-body); color: var(--text-1); }
.glyphs .score { font-size: 22px; }
</style>
</head>
<body>
<div class="panel">
  <div class="group"><b>글꼴</b><div class="row" id="fonts"></div></div>
  <div class="group"><b>크기 (설정, 비율 고정)</b><div class="row"><input type="range" id="width" min="260" max="420" step="10" value="320"><span class="val" id="sizeVal"></span></div></div>
  <div class="group"><b>틴트 강도</b><div class="row"><input type="range" id="tint" min="0" max="70" step="2" value="40"><span class="val" id="tintVal"></span></div></div>
  <div class="group"><b>틴트 범위</b><div class="row"><input type="range" id="reach" min="30" max="100" step="5" value="100"><span class="val" id="reachVal"></span></div></div>
  <div class="group"><b>불투명도 (설정)</b><div class="row"><input type="range" id="opacity" min="30" max="95" step="5" value="70"><span class="val" id="opacityVal"></span></div></div>
  <div class="group"><b>바탕화면</b><div class="row" id="walls"></div></div>
  <div class="group"><b>팀 (홈 / 원정)</b><div class="row"><select id="home"></select><select id="away"></select></div><div class="row" id="presets"></div></div>
  <div class="group"><b>현재 값</b><span id="readout"></span></div>
</div>
<div class="desk" id="desk" data-wall="bloom"></div>

<script>
// ESPN /eng.1/teams, 2026-10-19
// [id, displayName, shortDisplayName, color]
const teams = Object.fromEntries([["349","AFC Bournemouth","Bournemouth","f42727"],["359","Arsenal","Arsenal","e20520"],["362","Aston Villa","Aston Villa","660e36"],["337","Brentford","Brentford","f42727"],["331","Brighton & Hove Albion","Brighton","0606fa"],["363","Chelsea","Chelsea","144992"],["388","Coventry City","Coventry","87cced"],["384","Crystal Palace","C Palace","0202fb"],["368","Everton","Everton","0606fa"],["370","Fulham","Fulham","ffffff"],["306","Hull City","Hull","f28800"],["373","Ipswich Town","Ipswich","0000fa"],["357","Leeds United","Leeds","ffffff"],["364","Liverpool","Liverpool","d11317"],["382","Manchester City","Man City","99c5ea"],["360","Manchester United","Man United","da020e"],["361","Newcastle United","Newcastle","000000"],["393","Nottingham Forest","Nottm Forest","c8102e"],["366","Sunderland","Sunderland","EB172B"],["367","Tottenham Hotspur","Spurs","ffffff"]].map(([id, full, name, c]) => [id, { id, full, name, c }]));

const fonts = {
  "Segoe UI Variable": { body: '"Segoe UI Variable Text","Segoe UI",sans-serif', score: '"Segoe UI Variable Display","Segoe UI",sans-serif', size: 30 },
  "Inter": { body: "Inter", score: "Inter", size: 30 },
  "Barlow": { body: "Barlow", score: '"Barlow Condensed"', size: 34 },
  "Saira": { body: "Saira", score: '"Saira Condensed"', size: 34 },
  "Outfit": { body: "Outfit", score: "Outfit", size: 30 },
  "Manrope": { body: "Manrope", score: "Manrope", size: 30 },
};
const walls = { bloom: "Win11 블룸", light: "밝은 단색", photo: "사진" };
const presets = [["기본", "382", "359"], ["흰색 팀", "367", "363"], ["검정 팀", "361", "364"], ["비슷한 색", "360", "364"]];

const states = [
  { label: "실시간 · 홈 리드 (마우스 올려 보기)", kind: "live", comp: "Premier League", score: "2 – 1", status: "67'", goal: "Goal! 67' Haaland", lead: "home" },
  { label: "실시간 · 동점, 추가시간", kind: "live", comp: "Premier League", score: "2 – 2", status: "90'+3'", goal: "Goal! 90'+2' Saka (P)", lead: null },
  { label: "실시간 · 하프타임", kind: "live", comp: "Premier League", score: "1 – 0", status: "Half-Time", goal: "Goal! 23' Foden", lead: "home" },
  { label: "직전 결과 · 원정 승", kind: "result", comp: "Premier League", score: "1 – 3", lead: "away" },
  { label: "직전 결과 · 승부차기 (승자 색)", kind: "result", comp: "Carabao Cup", score: "1 – 1", pen: "4–3 PEN", lead: "home" },
  { label: "직전 결과 · 무승부", kind: "result", comp: "Premier League", score: "0 – 0", lead: null },
  { label: "다음 경기", kind: "next", comp: "UEFA Champions League", date: "Oct 24 (Sat)", time: "20:00" },
  { label: "다음 경기 · 연기됨", kind: "next", comp: "FA Cup", date: "Oct 24 (Sat)", time: "20:00", postponed: true },
  { label: "경기 없음", kind: "empty" },
];

const $ = (id) => document.getElementById(id);
const root = document.documentElement.style;
let font = "Outfit";

const refreshIcon = '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>';
const moreIcon = '<svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3.5h7v7"/><path d="M12.5 3.5l-9 9"/></svg>';
const logo = (t) => `<img src="https://a.espncdn.com/i/teamlogos/soccer/500-dark/${t.id}.png" onerror="this.onerror=null;this.src='https://a.espncdn.com/i/teamlogos/soccer/500/${t.id}.png'" alt="">`;
const team = (t) => `<div class="team">${logo(t)}<span class="name">${t.name}</span></div>`;

function card(s) {
  const H = teams[$("home").value], A = teams[$("away").value];
  if (s.kind === "empty") return `<div class="card"><div class="head"><span></span><span class="refresh">${refreshIcon}</span></div><div class="empty">No upcoming matches</div></div>`;
  const tint = s.lead ? ` tinted" style="--dir:${s.lead === "home" ? "to right" : "to left"};--tc:#${(s.lead === "home" ? H : A).c}` : "";
  const [hs, as] = (s.score || "").split(" – ");
  const score = `<div class="score"><span>${hs}</span><span>–</span><span>${as}</span></div>`;
  let center;
  const badge = (text, color) => `<span class="badge${color ? "" : " neutral"}" style="--bc:${color}">${text}</span>`;
  const winner = s.lead ? "#" + (s.lead === "home" ? H : A).c : null;
  if (s.kind === "live") center = score + (s.status === "Half-Time" ? badge("Half-Time", "#ffd60a") : `<div class="status"><i class="dot"></i>${s.status}</div>`);
  else if (s.kind === "result") center = score + badge(s.pen || "Full-Time", winner);
  else center = `<div class="date">${s.date}</div><div class="time">${s.time}</div>${s.postponed ? badge("Postponed", "#ff3b30") : ""}`;
  return `<div class="card${tint}"><div class="head"><span>${s.comp}</span><span class="refresh">${refreshIcon}</span></div>` +
    `<div class="match">${team(H)}<div class="center">${center}</div>${team(A)}</div>` +
    `<div class="foot${s.kind === "live" ? " live" : ""}">${s.goal ? `<span class="goal">${s.goal}</span>` : ""}<span class="more">More details${moreIcon}</span></div></div>`;
}

function render() {
  $("desk").innerHTML = states.map((s) => `<div class="slot"><small>${s.label}</small>${card(s)}</div>`).join("") +
    `<div class="slot"><small>글리프 확인 (악센트·숫자)</small><div class="glyphs">Borussia Mönchengladbach · Atlético Madrid · Deportivo Alavés · 1. FC Köln · AS Saint-Étienne<br><span class="score">0123456789 – 67' 90'+3' 20:00</span></div></div>`;
  update();
}

function update() {
  const f = fonts[font];
  root.setProperty("--font-body", f.body);
  root.setProperty("--font-score", f.score);
  root.setProperty("--score-size", f.size + "px");
  const w = +$("width").value;
  root.setProperty("--zoom", w / 320);
  root.setProperty("--tint", $("tint").value + "%");
  root.setProperty("--reach", $("reach").value + "%");
  root.setProperty("--opacity", $("opacity").value / 100);
  const h = Math.round(146 * w / 320);
  $("sizeVal").textContent = `${w} × ${h}px`;
  $("tintVal").textContent = $("tint").value + "%";
  $("reachVal").textContent = $("reach").value + "%";
  $("opacityVal").textContent = $("opacity").value + "%";
  $("readout").textContent = `font=${font} size=${w}x${h} tint=${$("tint").value}% reach=${$("reach").value}% opacity=${$("opacity").value}% wall=${$("desk").dataset.wall}`;
}

function buttons(el, entries, isOn, onPick) {
  el.innerHTML = "";
  for (const [key, text] of entries) {
    const b = document.createElement("button");
    b.textContent = text;
    b.setAttribute("aria-pressed", isOn(key));
    b.onclick = () => { onPick(key); for (const x of el.children) x.setAttribute("aria-pressed", x === b); };
    el.append(b);
  }
}

const options = Object.values(teams).map((t) => `<option value="${t.id}">${t.name}</option>`).join("");
$("home").innerHTML = options; $("away").innerHTML = options;
$("home").value = "382"; $("away").value = "359";
$("home").onchange = $("away").onchange = render;
for (const id of ["width", "tint", "reach", "opacity"]) $(id).oninput = update;

buttons($("fonts"), Object.keys(fonts).map((k) => [k, k]), (k) => k === font, (k) => { font = k; update(); });
buttons($("walls"), Object.entries(walls), (k) => k === "bloom", (k) => { $("desk").dataset.wall = k; update(); });
buttons($("presets"), presets.map(([n, h, a]) => [n, n]), () => false, (n) => {
  const [, h, a] = presets.find((p) => p[0] === n);
  $("home").value = h; $("away").value = a; render();
});
render();
</script>
</body>
</html>
